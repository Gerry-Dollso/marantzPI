<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <title>marantzPI</title>
  <link rel="stylesheet" href="/style.css?v=230">
</head>

<body>
  <section id="idleScreen" class="idle-screen" aria-hidden="true">
    <div class="idle-brand">MARANTZ</div>

    <div id="idleClock" class="idle-clock">00:00</div>
    <div id="idleDate" class="idle-date">MONDAY 28 JULY</div>

    <div class="idle-divider"></div>

    <div id="idleSourceIcon" class="idle-source-icon" aria-hidden="true">
      <div class="source-icon source-icon-record"></div>
      <div class="source-icon source-icon-cd"></div>
      <div class="source-icon source-icon-heos">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div id="idleInput" class="idle-input">TV AUDIO</div>

    <div class="idle-status">
      <span id="idlePower">RECEIVER ON</span>
      <span id="idleVolume">−32.0 dB</span>
    </div>

    <div class="idle-input-controls">
      <button data-action="phono">PHONO</button>
      <button data-action="cd">CD</button>
      <button data-action="heos">HEOS</button>
      <button data-action="aux">AUX</button>
    </div>
  </section>

  <main id="nowPlayingScreen" class="display">
    <section class="artwork-area">
      <div class="artwork-frame">
        <img id="artwork" alt="Album artwork">
        <div id="artworkFallback" class="artwork-fallback">
          <span>MARANTZ</span>
        </div>
      </div>
    </section>

    <section class="information">
      <header>
        <div class="heading">NOW PLAYING</div>
        <button
          id="connection"
          class="connection power-button"
          type="button"
          aria-label="Hold to put receiver into standby"
          title="Hold to power off AVR"
        >POWER</button>
      </header>

      <div class="metadata">
        <h1 id="song">Waiting for music…</h1>
        <h2 id="artist"></h2>
        <p id="album"></p>
      </div>

      <div class="progress-section">
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="times">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="transport">
        <button data-action="previous" aria-label="Previous track">◀◀</button>
        <button
          id="playPause"
          class="play-pause"
          data-action="pause"
          aria-label="Play or pause"
        >Ⅱ</button>
        <button data-action="next" aria-label="Next track">▶▶</button>
      </div>

      <div class="receiver-controls">
        <button data-action="volume-down" aria-label="Volume down">−</button>
        <button id="muteButton" data-action="mute" aria-label="Mute">MUTE</button>
        <button data-action="volume-up" aria-label="Volume up">＋</button>
      </div>

      <div class="inputs">
        <button data-action="phono">PHONO</button>
        <button data-action="cd">CD</button>
        <button data-action="heos">HEOS</button>
        <button data-action="aux">AUX</button>
      </div>
    </section>
  </main>


  <div
    id="volumeOverlay"
    class="volume-overlay"
    aria-hidden="true"
    aria-live="polite"
  >
    <div id="volumeOverlayValue" class="volume-overlay-value">−32.0 dB</div>
    <div class="volume-overlay-track">
      <div id="volumeOverlayBar" class="volume-overlay-bar"></div>
    </div>
  </div>

  <script src="/app.js?v=232"></script>
</body>
</html>
