<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <title>marantzPI</title>
  <link rel="stylesheet" href="/style.css?v=230">
  <link rel="stylesheet" href="/playback-source-ui.css?v=3">
  <link rel="stylesheet" href="/radio-ui.css?v=2">
  <link rel="stylesheet" href="/tidal-ui.css?v=1">
  <link rel="stylesheet" href="/standby-skin.css?v=1">
  <link rel="stylesheet" href="/tv-ui.css?v=3">
  <link rel="stylesheet" href="/waveshare-1280.css?v=1">
</head>

<body>
  <button id="receiverSettings" class="receiver-settings" type="button" aria-label="Open SR8015 settings" title="SR8015 settings">SETTINGS</button>
  <section id="idleScreen" class="idle-screen" aria-hidden="true">
    <div class="idle-brand"><img class="standby-marantz-logo" src="/marantz-logo.png" alt="Marantz"></div>

    <div id="idleClock" class="idle-clock">00:00</div>
    <div id="idleDate" class="idle-date">MONDAY 28 JULY</div>

    <div class="idle-divider"></div>

    <div id="idleSourceIcon" class="idle-source-icon" aria-hidden="true">
      <div class="source-icon source-icon-record"></div>
      <div class="source-icon source-icon-cd"></div>
      <div class="source-icon source-icon-heos">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div id="idleInput" class="idle-input">TV AUDIO</div>

    <div class="idle-status">
      <span id="idlePower">RECEIVER ON</span>
      <span id="idleVolume">−32.0 dB</span>
    </div>

    <div class="idle-input-controls">
      <button data-action="phono">PHONO</button>
      <button data-action="cd">CD</button>
      <button data-action="heos" data-net-source="tidal">TIDAL</button>
      <button data-radio-open>RADIO</button>
      <button data-action="aux">AUX</button>
    </div>
      <div class="standby-zone-control standby-zone-left"><span id="standbyZone2Source" class="zone-outdoor" role="button" aria-label="Select Patio source" title="Patio source"></span><button id="standbyZone2Power" class="zone-power-button">POWER</button></div>
      <div class="standby-zone-control standby-zone-right"><span class="zone-headphones"></span><button id="standbyZone3Power" class="zone-power-button">POWER</button></div>
  </section>

  <section id="tvScreen" class="tv-screen" aria-hidden="true">
    <button
      id="tvPower"
      class="tv-power"
      type="button"
      aria-label="Hold to put receiver into standby"
      title="Hold to power off AVR"
    >POWER</button>

    <div class="tv-centre">
      <div class="tv-brand"><img class="tv-marantz-logo" src="/marantz-logo.png" alt="Marantz"></div>
      <div class="tv-divider"></div>
      <div class="tv-title">TV</div>
    </div>

    <div class="tv-inputs">
      <button data-action="phono">PHONO</button>
      <button data-action="cd">CD</button>
      <button data-action="heos" data-net-source="tidal">TIDAL</button>
      <button data-radio-open>RADIO</button>
      <button data-action="aux">AUX</button>
    </div>
  </section>
  <section id="projectorScreen" class="tv-screen" aria-hidden="true">
    <button
      id="projectorPower"
      class="tv-power"
      type="button"
      aria-label="Hold to put receiver into standby"
      title="Hold to power off AVR"
    >POWER</button>

    <div class="tv-centre">
      <div class="tv-brand"><img class="tv-marantz-logo" src="/marantz-logo.png" alt="Marantz"></div>
      <div class="tv-divider"></div>
      <div class="tv-title">SONY<br>VPL-HW65ES</div>
    </div>

    <div class="tv-inputs">
      <button data-action="phono">PHONO</button>
      <button data-action="cd">CD</button>
      <button data-action="heos" data-net-source="tidal">TIDAL</button>
      <button data-radio-open>RADIO</button>
      <button data-action="aux">AUX</button>
    </div>
  </section>

  <main id="nowPlayingScreen" class="display">
    <section class="artwork-area">
      <div class="artwork-frame">
        <img id="artwork" alt="Album artwork">
        <div id="artworkFallback" class="artwork-fallback">
          <img class="marantz-fallback-logo" src="/marantz-logo.png" alt="Marantz">
        </div>
      </div>
    </section>

    <section class="information">
      <header>
        <div id="sourceHeading" class="heading">NOW PLAYING</div>
        <button
          id="connection"
          class="connection power-button"
          type="button"
          aria-label="Hold to put receiver into standby"
          title="Hold to power off AVR"
        >POWER</button>
      </header>

      <div class="metadata">
        <h1 id="song">Waiting for music…</h1>
        <h2 id="artist"></h2>
        <p id="album"></p>
      </div>

      <div class="progress-section">
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="times">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="transport">
        <button data-action="previous" aria-label="Previous track">◀◀</button>
        <button
          id="playPause"
          class="play-pause"
          data-action="pause"
          aria-label="Play or pause"
        >Ⅱ</button>
        <button data-action="next" aria-label="Next track">▶▶</button>
      </div>

      <div class="receiver-controls">
        <button data-action="volume-down" aria-label="Volume down">−</button>
        <button id="muteButton" data-action="mute" aria-label="Mute">MUTE</button>
        <button data-action="volume-up" aria-label="Volume up">＋</button>
      </div>

      <div class="inputs">
        <button data-action="phono">PHONO</button>
        <button data-action="cd">CD</button>
        <button data-action="heos" data-net-source="tidal">TIDAL</button>
        <button data-radio-open>RADIO</button>
        <button data-action="aux">AUX</button>
      </div>
    </section>

    <div class="zone-power-controls" aria-label="Zone power controls">
      <span id="zone2Source" class="zone-outdoor" role="button" aria-label="Select Patio source" title="Patio source"></span>
      <button
        id="zone2Power"
        class="zone-power-button"
        type="button"
        aria-label="Toggle Zone 2 power"
        title="Zone 2 power"
      >POWER</button>

      <span class="zone-headphones" aria-hidden="true"></span>
      <button
        id="zone3Power"
        class="zone-power-button"
        type="button"
        aria-label="Toggle headphone zone power"
        title="Headphone zone power"
      >POWER</button>
    </div>
  </main>
  <div id="zone2SourceMenu" class="zone2-source-menu" aria-hidden="true">
    <button type="button" data-zone2-source="source">SOURCE</button>
    <button type="button" data-zone2-source="phono">PHONO</button>
    <button type="button" data-zone2-source="cd">CD</button>
    <button type="button" data-zone2-source="heos">HEOS</button>
  </div>

    <section id="tidalScreen" class="tidal-screen" aria-hidden="true">
      <header class="tidal-header">
        <button id="tidalBack" class="tidal-back" type="button">BACK</button>
        <div>
          <div class="tidal-kicker">HEOS MUSIC</div>
          <h1>TIDAL</h1>
        </div>
        <div></div>
      </header>

      <form id="tidalSearchForm" class="tidal-search">
        <input
          id="tidalSearchInput"
          type="search"
          placeholder="Search artists"
          autocomplete="off"
          autocapitalize="words"
          spellcheck="false"
        >
        <button type="submit">SEARCH</button>
      </form>

      <div id="tidalStatus" class="tidal-status">Search TIDAL by artist</div>
      <div id="tidalResults" class="tidal-results" aria-live="polite"></div>

    <div id="tidalKeyboard" class="tidal-keyboard" aria-hidden="true">
      <div class="tidal-key-row">
        <button type="button" data-key="Q">Q</button>
        <button type="button" data-key="W">W</button>
        <button type="button" data-key="E">E</button>
        <button type="button" data-key="R">R</button>
        <button type="button" data-key="T">T</button>
        <button type="button" data-key="Y">Y</button>
        <button type="button" data-key="U">U</button>
        <button type="button" data-key="I">I</button>
        <button type="button" data-key="O">O</button>
        <button type="button" data-key="P">P</button>
      </div>
      <div class="tidal-key-row tidal-key-row-middle">
        <button type="button" data-key="A">A</button>
        <button type="button" data-key="S">S</button>
        <button type="button" data-key="D">D</button>
        <button type="button" data-key="F">F</button>
        <button type="button" data-key="G">G</button>
        <button type="button" data-key="H">H</button>
        <button type="button" data-key="J">J</button>
        <button type="button" data-key="K">K</button>
        <button type="button" data-key="L">L</button>
      </div>
      <div class="tidal-key-row">
        <button type="button" data-key="Z">Z</button>
        <button type="button" data-key="X">X</button>
        <button type="button" data-key="C">C</button>
        <button type="button" data-key="V">V</button>
        <button type="button" data-key="B">B</button>
        <button type="button" data-key="N">N</button>
        <button type="button" data-key="M">M</button>
        <button type="button" data-key-action="backspace">⌫</button>
      </div>
      <div class="tidal-key-row tidal-key-row-bottom">
        <button type="button" data-key-action="clear">CLEAR</button>
        <button type="button" class="tidal-space-key" data-key=" ">SPACE</button>
        <button type="button" data-key-action="search">SEARCH</button>
      </div>
    </div>
    </section>

  <section id="radioScreen" class="radio-screen" aria-hidden="true">
    <header class="radio-header">
      <button id="radioBack" class="radio-back" type="button">BACK</button>
      <div>
        <div class="radio-kicker">HEOS FAVOURITES</div>
        <h1>RADIO</h1>
      </div>
      <button id="radioAll" class="radio-all" type="button">ALL STATIONS</button>
    </header>

    <div id="radioStatus" class="radio-status">Loading favourites…</div>
    <div id="radioGrid" class="radio-grid" aria-live="polite"></div>
    <div id="radioList" class="radio-list" aria-live="polite"></div>
  </section>

  <div
    id="volumeOverlay"
    class="volume-overlay"
    aria-hidden="true"
    aria-live="polite"
  >
    <div id="volumeOverlayValue" class="volume-overlay-value">−32.0 dB</div>
    <div class="volume-overlay-track">
      <div id="volumeOverlayBar" class="volume-overlay-bar"></div>
    </div>
  </div>

  <script src="/app.js?v=232"></script>
  <script src="/screen-state.js?v=2"></script>
  <script src="/tv-ui.js?v=1"></script>
  <script src="/playback-source-ui.js?v=5"></script>
  <script src="/radio-ui.js?v=2"></script>
  <script src="/tidal-ui.js?v=1"></script>
</body>
</html>
